name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
    paths: [Index.html, pages/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir sitio
        run: |
          mkdir site
          cp pages/config.js site/config.js
          sed 's|<!--CONFIG-->|<script src="config.js"></script>|' Index.html > site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: dep
        uses: actions/deploy-pages@v4
